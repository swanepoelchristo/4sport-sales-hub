first_production_boundary:
  classification: CONFIRMED
  status: "proposed_minimum_requiring_product_owner_approval"
  conditions:
    - "verified dedicated Supabase project"
    - "approved authenticated users and roles"
    - "Product Owner-selected core CRM, meeting, signup or onboarding, WhatsApp triage, and support-ticket functions"
    - "server-side authorisation and least-privilege RLS"
    - "audit identity derived from authenticated sessions"
    - "no direct writes into main 4SPORT production"
    - "no secret exposure"
    - "authenticated service-role routes"
    - "verified webhook authenticity"
    - "reproducible migrations"
    - "verified deployed commit, liveness check, smoke-test plan, backup, and rollback target"
  exclusions_unless_approved:
    - "Impact War Room"
    - "Marketing Lab expansion"
    - "external calendar sync"
    - "automated notifications"
    - "main-database integration"

smallest_recommended_next_action:
  type: "read_only_production_evidence_capture"
  classification: CONFIRMED
  steps:
    - "identify exact Coolify application, branch, and deployed commit"
    - "identify runtime domain and container or build configuration"
    - "capture environment-variable names only"
    - "verify dedicated Supabase project boundary"
    - "record applied migration and schema state"
    - "record current role and RLS shape"
    - "check /api/health without running write-capable System Check"
  prohibited_actions:
    - "deploy"
    - "migrate"
    - "repair"
    - "expose secrets"
    - "change production data"
