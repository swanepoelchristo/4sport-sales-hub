  - id: SH-035
    area: health
    statement: "/api/health proves full production health."
    classification: CONFLICTING
    rationale: "It proves application liveness only."
  - id: SH-036
    area: deployment
    statement: "A known rollback target is required before deployment."
    classification: CONFIRMED

