  - id: SH-026
    area: support
    statement: "Support tickets require queue, severity, ownership, SLA, notes, status, and resolution."
    classification: CONFIRMED
  - id: SH-027
    area: calendar
    statement: "Internal meeting scheduling proves external calendar integration."
    classification: NO_EVIDENCE

  - id: SH-030
    area: deployment
    statement: "Intended deployment flow is GitHub to Ubuntu production server to Coolify to production."
    classification: CONFIRMED
  - id: SH-031
    area: deployment
    statement: "The current production domain can be taken from historical documentation."
    classification: CONFLICTING
    rationale: "The target must be verified from current Coolify and runtime evidence."
