schema_version: "1.0"
document:
  title: "4SPORT Sales Hub Project Decision and Evidence Inventory"
  repository: "swanepoelchristo/4sport-sales-hub"
  branch_baseline: "main"
  inspection_commit: "bc4752041e277403dd5c73e9c93fecd6d22db65d"
  recorded_date: "2026-08-06"
  status: "living_product_owner_decision_and_evidence_inventory"
  final_production_success_contract: false
  documentation_only: true

classifications:
  - CONFIRMED
  - IMPLEMENTED
  - PARTIAL
  - ABSENT
  - CONFLICTING
  - NO_EVIDENCE
  - OUT_OF_SCOPE

source_of_truth_rule: "Current Product Owner instruction controls. Repository code, routes, components, migrations, README text, and deployment notes are evidence and must not be silently promoted into approved intent."

decisions:
  - id: SH-001
    area: product_identity
    statement: "The Sales Hub is a standalone internal 4SPORT application."
    classification: CONFIRMED
    rationale: "It is operationally separate from the main 4SPORT application."
  - id: SH-002
    area: product_identity
    statement: "The Sales Hub is not the main 4SPORT application."
    classification: CONFIRMED
    rationale: "Main-app roles and operational data are not automatically Sales Hub scope."
  - id: SH-003
    area: product_purpose
    statement: "Core purpose includes sales CRM, leads, pipeline, meetings, onboarding, WhatsApp support, support tickets, and internal staff operations."
    classification: CONFIRMED
    rationale: "Current Product Owner baseline."
  - id: SH-004
    area: scope_governance
    statement: "Existing repository features automatically define approved scope."
    classification: CONFLICTING
    rationale: "Repository presence is evidence only; Product Owner approval remains controlling."
  - id: SH-005
    area: scope
    statement: "Impact War Room is included in the first-production boundary."
    classification: OUT_OF_SCOPE
    rationale: "Implementation evidence exists, but first-production approval is not established."
  - id: SH-006
    area: scope
    statement: "Marketing Lab and public attribution are included in the first-production boundary."
    classification: OUT_OF_SCOPE
    rationale: "Separate Product Owner approval is required."
  - id: SH-007
    area: contract_status
    statement: "These Sidekick files are the final Production Success Contract."
    classification: CONFIRMED
    value: false
    rationale: "They are living knowledge and evidence inventories."

  - id: SH-010
    area: governance
    statement: "Product Owner approval governs scope, integrations, and production acceptance."
    classification: CONFIRMED
  - id: SH-011
    area: roles
    statement: "The two designated back-office accounts use the existing admin role."
    classification: CONFIRMED
    accounts:
      - "info@4sport.co.za"
      - "support@4sport.co.za"
    rationale: "Current operating model; runtime linkage still requires verification."
  - id: SH-012
    area: roles
    statement: "Sales representatives use sales_rep."
    classification: IMPLEMENTED
  - id: SH-013
    area: roles
    statement: "Call-centre agents use call_center_agent."
    classification: PARTIAL
    rationale: "Signup, profile, approval status, lead scope, and activity foundations exist; production activation is unverified."
  - id: SH-014
    area: roles
    statement: "Christo requires a separate permanent support role."
    classification: CONFLICTING
    rationale: "Historical migrations added support; later agreed model uses admin for both back-office accounts."
  - id: SH-015
    area: authorisation
    statement: "Front-end navigation is sufficient role enforcement."
    classification: CONFLICTING
    rationale: "Database and server-side authorisation are required boundaries."
  - id: SH-016
    area: audit_identity
    statement: "Support operator identity is reliably derived from the authenticated user."
    classification: CONFLICTING
    rationale: "The inspected UI allowed a selectable staff name."

  - id: SH-020
    area: workflow
    statement: "Leads enter through approved public organisation intake paths."
    classification: CONFIRMED
  - id: SH-021
    area: workflow
    statement: "Leads are reviewed, assigned, contacted, and progressed in the CRM."
    classification: CONFIRMED
  - id: SH-022
    area: workflow
    statement: "Contact outcomes, notes, and follow-ups must be recorded."
